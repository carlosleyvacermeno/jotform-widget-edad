<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fecha de nacimiento y edad</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:8px;font:16px Arial,sans-serif;color:#2c3345;background:transparent}.fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(90px,1fr);gap:20px}label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}input{width:100%;min-height:44px;border:1px solid #b8bdc9;border-radius:4px;padding:10px;font:inherit;color:inherit;background:#fff}input:focus{outline:2px solid #486bdb;outline-offset:2px}input[readonly]{background:#f3f4f7}small{display:block;margin-top:7px;color:#596274;font-size:12px}.error{color:#b42318;min-height:20px;margin:12px 0 0;font-size:14px}[aria-invalid=true]{border-color:#b42318}@media(max-width:340px){.fields{grid-template-columns:1fr;gap:16px}}
</style>
</head>
<body>
<div class="fields">
<div><label for="birth">FECHA DE NACIMIENTO *</label><input id="birth" type="date" required min="0001-01-01" aria-describedby="date-help error"><small id="date-help">Debe ser anterior a hoy.</small></div>
<div><label for="age">EDAD</label><input id="age" type="text" readonly aria-live="polite" aria-describedby="age-help"><small id="age-help">Años cumplidos</small></div>
</div>
<p id="error" class="error" role="alert"></p>
<script id="age-core">
function parseDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return null;
  const [y,m,d]=value.split('-').map(Number);
  const leap=y%4===0&&(y%100!==0||y%400===0);
  const lengths=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  return y>=1&&m>=1&&m<=12&&d>=1&&d<=lengths[m-1]?{y,m,d}:null;
}
function todayInLima(now=new Date()){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Lima',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
  const get=t=>parts.find(p=>p.type===t).value;
  return `${get('year').padStart(4,'0')}-${get('month')}-${get('day')}`;
}
function calculateAge(birth,today){
  const b=parseDate(birth),t=parseDate(today);
  if(!b||!t||birth>=today)return null;
  // En años no bisiestos, quien nació el 29 de febrero cumple años el 1 de marzo.
  return t.y-b.y-Number(t.m<b.m||(t.m===b.m&&t.d<b.d));
}
function yesterday(today){
  const p=parseDate(today),date=new Date(0);
  date.setUTCFullYear(p.y,p.m-1,p.d);date.setUTCHours(0,0,0,0);date.setUTCDate(date.getUTCDate()-1);
  return date.toISOString().slice(0,10);
}
</script>
<script>
const birth=document.getElementById('birth'),age=document.getElementById('age'),error=document.getElementById('error');
const qid=new URLSearchParams(location.search).get('qid');
const sourceId=({'59':'34','60':'52'})[qid]||'';
const isAgeColumn=!!sourceId;
let connected=false,api=null;
if(isAgeColumn){document.body.setAttribute('aria-hidden','true');age.tabIndex=-1;birth.parentElement.hidden=true;birth.required=false;error.hidden=true;document.querySelector('.fields').style.display='block';document.querySelector('label[for="age"]').textContent='EDAD PARA EXPORTACIÓN';}
function sibling(id){for(let i=0;i<parent.frames.length;i++){try{const w=parent.frames[i],u=new URL(w.location.href);if(u.origin===location.origin&&u.searchParams.get('qid')===id)return w;}catch{}}return null;}
function marriageSelected(){try{return !!sibling('46')?.document.getElementById('matrimonio')?.checked;}catch{return false;}}
function post(message){if(window===parent)return;for(let i=0;i<parent.frames.length;i++){try{parent.frames[i].postMessage(message,location.origin);}catch{}}}
function sendAge(){post({type:'carlos-birth-age',sourceId:qid,value:qid==='52'&&!marriageSelected()?'':age.value});}
function askAge(){if(isAgeColumn)post({type:'carlos-birth-request',sourceId});}
function update(showError=false){
  if(isAgeColumn){const result={valid:true,value:age.value};if(connected)api.sendData(result);return result;}
  const today=todayInLima();birth.max=yesterday(today);
  const years=calculateAge(birth.value,today),valid=years!==null;
  age.value=valid?String(years):'';
  const message=valid?'':birth.value?'Ingrese una fecha válida anterior a hoy.':'Ingrese su fecha de nacimiento.';
  birth.setCustomValidity(message);birth.setAttribute('aria-invalid',String(!valid&&(showError||!!birth.value)));
  error.textContent=showError||birth.value?message:'';
  const value=valid?birth.value.split('-').reverse().join('-'):'';
  if(connected){api.sendData({valid,value});api.requestFrameResize({height:document.body.scrollHeight+16});sendAge();}
  return {valid,value};
}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||!event.source||event.source===window)return;
  let u;try{if(event.source.parent!==parent)return;u=new URL(event.source.location.href);}catch{return;}
  const sender=u.searchParams.get('qid'),msg=event.data;
  if(u.pathname===location.pathname){
    if(isAgeColumn&&sender===sourceId&&msg?.type==='carlos-birth-age'&&msg.sourceId===sourceId){age.value=/^\d+$/.test(msg.value)?msg.value:'';update();}
    if(!isAgeColumn&&msg?.type==='carlos-birth-request'&&msg.sourceId===qid&&({'59':'34','60':'52'})[sender]===qid)sendAge();
  }
  if(u.pathname==='/jotform-widget-edad/widget-matrimonio.html'&&sender==='46'&&msg?.type==='carlos-marriage-state'&&qid==='52')update();
});
birth.addEventListener('input',()=>update());birth.addEventListener('change',()=>update(true));
window.addEventListener('focus',()=>update());document.addEventListener('visibilitychange',()=>{if(!document.hidden)update();});
window.addEventListener('resize',()=>update());setInterval(()=>update(),60000);update();
function restore(raw){
 if(!raw)return;
 let saved=raw;try{const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')saved=parsed.fecha_nacimiento||'';}catch{}
 if(typeof saved!=='string')return;
 if(/^\d{2}-\d{2}-\d{4}$/.test(saved))saved=saved.split('-').reverse().join('-');
 if(parseDate(saved))birth.value=saved;
}
function connect(){api=window.JFCustomWidget;
 api.subscribe('ready',data=>{if(!isAgeColumn)restore(data?.value);connected=true;update();askAge();});
 api.subscribe('submit',()=>{const result=update(true);api.sendSubmit(result);if(!result.valid)birth.focus();});
}
if(window.self!==window.top){const script=document.createElement('script');script.onload=connect;script.src='https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js';script.onerror=()=>{error.textContent='No se pudo conectar con Jotform. Recargue el formulario antes de enviarlo.';};document.head.appendChild(script);}
</script>
</body>
</html>
