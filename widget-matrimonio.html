<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar matrimonio</title><style>body{margin:0;padding:8px;font:16px Arial,sans-serif;color:#2c3345}label{display:inline-flex;align-items:center;gap:28px;line-height:24px;font-weight:700;cursor:pointer}input{width:19px;height:19px;margin:0;accent-color:#2e69ff;flex-shrink:0}input:focus-visible{outline:2px solid #2e69ff;outline-offset:3px}p{font-size:13px;line-height:18px;margin:6px 0 0;color:#596273}</style></head><body><label for="matrimonio">¿Registrará Matrimonio?<input id="matrimonio" type="checkbox" aria-describedby="ayuda"></label><p id="ayuda">marque la casilla si ambos esposos participarán de la peregrinación</p><script>
let api=null,connected=false,linked=false;
const checkbox=document.getElementById('matrimonio');
function value(){return checkbox.checked?'Sí':'No';}
function broadcast(){if(!linked)return;for(let i=0;i<parent.frames.length;i++){try{parent.frames[i].postMessage({type:'carlos-marriage-state',formId:'262631114450042',marked:checkbox.checked},location.origin);}catch{}}}
function send(){if(connected)api.sendData({valid:true,value:value()});broadcast();}
window.addEventListener('message',event=>{
 if(!linked||event.origin!==location.origin||!event.source||event.source===window)return;
 try{const url=new URL(event.source.location.href);if(event.source.parent!==parent||url.pathname!=='/jotform-widget-edad/widget-sexo.html'||!['45','51'].includes(url.searchParams.get('qid')))return;}catch{return;}
 if(event.data?.type==='carlos-sex-request'&&event.data.formId==='262631114450042')broadcast();
});
checkbox.addEventListener('change',send);
function connect(){api=window.JFCustomWidget;api.subscribe('ready',data=>{checkbox.checked=!!(data&&data.value==='Sí');connected=true;linked=new URLSearchParams(location.search).get('qid')==='46';send();});api.subscribe('submit',()=>api.sendSubmit({valid:true,value:value()}));}
if(window.self!==window.top){const script=document.createElement('script');script.onload=connect;script.src='https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js';document.head.appendChild(script);}
</script></body></html>
