<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocaciones</title><style>*{box-sizing:border-box}body{margin:0;padding:8px;font:14px Arial;color:#53617a;background:white}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px;gap:8px;align-items:end;margin-bottom:12px}label{display:block;margin-bottom:7px}input,select{width:100%;height:40px;border:1px solid #b8bfd0;border-radius:4px;padding:8px;background:white;color:#27334a;font:inherit}button{cursor:pointer;border-radius:4px;padding:10px;border:1px solid #b8bfd0}.remove{height:40px}.add{background:#29345e;color:white;border:0}#error{color:#b42318}#error:empty{display:none}:focus-visible{outline:2px solid #5785e8;outline-offset:2px}[aria-invalid=true]{border-color:#b42318}@media(max-width:380px){.row{grid-template-columns:1fr 30px}.field{grid-column:1}.remove{grid-column:2;grid-row:2}}</style></head><body><main aria-label="Vocaciones"><div id="rows"></div><button type="button" class="add" id="add">+ Haga clic para agregar otra vocación</button><p id="error" role="alert"></p></main><script>
(()=>{'use strict';
const choices=['Seminario','Itinerante','Vida contemplativa','Familia en Misión','Hermana para el seminario'];
const rows=document.getElementById('rows');let seq=0,bridge=null;
function resize(){if(bridge)bridge.requestFrameResize({height:Math.ceil(document.documentElement.scrollHeight)});}
function result(show=false){let valid=true;const values=[];for(const row of rows.children){const input=row.querySelector('input'),select=row.querySelector('select');const nombres=input.value.trim(),carisma=select.value;const complete=(!nombres&&!carisma)||(!!nombres&&choices.includes(carisma));if(!complete)valid=false;input.setAttribute('aria-invalid',String(show&&!complete&&!nombres));select.setAttribute('aria-invalid',String(show&&!complete&&!carisma));if(nombres||carisma)values.push({nombres,carisma});}document.getElementById('error').textContent=show&&!valid?'Complete Nombres y seleccione un Carisma en cada fila utilizada.':'';return{valid,value:values.length?JSON.stringify(values):''};}
function sync(){if(bridge)bridge.sendData(result());resize();}
function add(data={},focus=false){const id=++seq,row=document.createElement('div');row.className='row';row.innerHTML=`<div class="field"><label for="name-${id}">Nombres</label><input id="name-${id}" maxlength="500" autocomplete="off"></div><div class="field"><label for="charism-${id}">Carisma</label><select id="charism-${id}"><option value="" disabled selected hidden>Seleccione</option></select></div><button class="remove" type="button" aria-label="Eliminar vocación">×</button>`;const input=row.querySelector('input'),select=row.querySelector('select');for(const label of choices){const option=document.createElement('option');option.value=label;option.textContent=label;select.append(option);}input.value=typeof data.nombres==='string'?data.nombres:'';select.value=choices.includes(data.carisma)?data.carisma:'';row.querySelector('button').addEventListener('click',()=>{row.remove();if(!rows.children.length)add();sync();});input.addEventListener('input',sync);select.addEventListener('change',sync);rows.append(row);if(focus)input.focus();resize();}
document.getElementById('add').addEventListener('click',()=>{add({},true);sync();});add();
if(window.self!==window.top){const sdk=document.createElement('script');sdk.src='https://js.jotform.com/JotFormCustomWidget.min.js';sdk.onload=()=>{JFCustomWidget.subscribe('ready',event=>{bridge=JFCustomWidget;if(event&&event.value){try{const saved=JSON.parse(event.value);if(Array.isArray(saved)&&saved.length){rows.replaceChildren();for(const item of saved)add(item&&typeof item==='object'?item:{});}}catch{document.getElementById('error').textContent='No se pudieron recuperar las vocaciones guardadas.';}}bridge.subscribe('submit',()=>{bridge.sendSubmit(result(true));resize();});sync();});};sdk.onerror=()=>{document.getElementById('error').textContent='No se pudo conectar con Jotform. Recargue antes de enviar.';};document.head.append(sdk);}
new ResizeObserver(resize).observe(document.querySelector('main'));
})();
</script></body></html>
